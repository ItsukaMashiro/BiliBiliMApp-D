name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      gadget:
        description: 'Diagnostic build: embed frida-gadget 17.24.3 + NJPipProbe.js and patch the main executable with an LC_LOAD_DYLIB for it'
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  MONKEYDEV_COMMIT: c37b5cc5e9a4184d80eb18fb9ae8c48bb8689442
  THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
  TARGET_APP_URL: https://github.com/TouchFriend/BiliBiliMApp/releases/download/3.1.0/bili-universal_8.89.0.app.zip
  UPSTREAM_IPA_URL: https://github.com/TouchFriend/BiliBiliMApp/releases/download/3.1.0/BiliBiliMApp_8.89.0.v3.1.0.ipa
  ELLEKIT_SHA256: ca7aae6dd4c5591bb93510076f0f73d6e688e12e09cab37e91203fb12343b6ee

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install ldid

          git clone https://github.com/AloneMonkey/MonkeyDev.git "$RUNNER_TEMP/MonkeyDev"
          git -C "$RUNNER_TEMP/MonkeyDev" checkout "$MONKEYDEV_COMMIT"

          git clone https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" checkout "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive --depth 1

          sudo mkdir -p /opt
          sudo mv "$RUNNER_TEMP/MonkeyDev" /opt/MonkeyDev
          sudo mv "$RUNNER_TEMP/theos" /opt/theos
          sudo chmod -R a+rX /opt/MonkeyDev /opt/theos
          echo "/opt/MonkeyDev/bin" >> "$GITHUB_PATH"
          echo "/opt/theos/bin" >> "$GITHUB_PATH"

      - name: Download target app
        run: |
          mkdir -p BiliBiliMD/TargetApp
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/bili-universal.app.zip" \
            "$TARGET_APP_URL"
          # MonkeyDev's pack.sh copies the first .app it finds into TargetApp.
          # Keeping the source app inside TargetApp makes that copy recursive and
          # leaves a complete nested .app in the final bundle.
          ditto -x -k "$RUNNER_TEMP/bili-universal.app.zip" BiliBiliMD
          rm -rf BiliBiliMD/__MACOSX

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/upstream.ipa" \
            "$UPSTREAM_IPA_URL"
          unzip -p "$RUNNER_TEMP/upstream.ipa" \
            'Payload/*.app/Frameworks/libellekit.dylib' \
            > "$RUNNER_TEMP/libellekit.dylib"
          test -s "$RUNNER_TEMP/libellekit.dylib"
          echo "$ELLEKIT_SHA256  $RUNNER_TEMP/libellekit.dylib" | shasum -a 256 --check
          install -m 0755 \
            "$RUNNER_TEMP/libellekit.dylib" \
            BiliBiliMD/bili-universal.app/Frameworks/libellekit.dylib

          xattr -cr BiliBiliMD/bili-universal.app
          test -d BiliBiliMD/bili-universal.app
          test -s BiliBiliMD/bili-universal.app/Frameworks/libellekit.dylib

      - name: Generate build stamp header
        run: |
          # NJDetailPlayerAd.xm reads NJ_PI_P_BUILD_SHA via __has_include("NJBuildStamp.h")
          # with a "local" fallback; the quoted include resolves next to the .xm, so
          # generate the header there (CI-only, never committed).
          printf '#define NJ_PI_P_BUILD_SHA "%s"\n' "${GITHUB_SHA:0:7}" \
            > BiliBiliMDDylib/Logos/Detail/NJBuildStamp.h
          cat BiliBiliMDDylib/Logos/Detail/NJBuildStamp.h

      - name: Build injected app
        run: |
          xcodebuild \
            -project BiliBiliMD.xcodeproj \
            -scheme BiliBiliMD \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MONKEYDEV_INSERT_DYLIB=YES \
            MONKEYDEV_ADD_SUBSTRATE=YES \
            build

      - name: Validate assembled app
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/BiliBiliMD.app"
          test -d "$APP_PATH"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test -n "$APP_EXECUTABLE"
          test -s "$APP_PATH/$APP_EXECUTABLE"

          if [[ "${{ github.event.inputs.gadget }}" == "true" ]]; then
            echo "IPA_ARTIFACT_NAME=BiliBiliMApp-D-gadget" >> "$GITHUB_ENV"
          else
            echo "IPA_ARTIFACT_NAME=BiliBiliMApp-D-unsigned" >> "$GITHUB_ENV"
          fi

          # MonkeyDev's BSD cp invocation can leave the source bundle as a child
          # even after its contents have been copied into the built app. The outer
          # executable check above makes it safe to remove only that exact duplicate.
          DUPLICATE_SOURCE_APP="$APP_PATH/bili-universal.app"
          if [[ -d "$DUPLICATE_SOURCE_APP" ]]; then
            echo "Removing duplicate source bundle: $DUPLICATE_SOURCE_APP"
            rm -rf "$DUPLICATE_SOURCE_APP"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleName BiliBiliMAppD" "$APP_PATH/Info.plist"
          IPA_BUNDLE_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP_PATH/Info.plist")"
          echo "Final CFBundleName: $IPA_BUNDLE_NAME"
          test "$IPA_BUNDLE_NAME" = "BiliBiliMAppD"
          test -s "$APP_PATH/Frameworks/libellekit.dylib"
          lipo -archs "$APP_PATH/Frameworks/libellekit.dylib" | grep -qw arm64
          otool -L "$APP_PATH/Frameworks/BilibiliVideoTools.dylib" \
            | grep -F '@executable_path/Frameworks/libellekit.dylib'
          NESTED_APP=""
          for CANDIDATE in "$APP_PATH"/*.app; do
            if [[ -d "$CANDIDATE" ]]; then
              NESTED_APP="$CANDIDATE"
              break
            fi
          done
          if [[ -n "$NESTED_APP" ]]; then
            echo "Unexpected nested app bundle: $NESTED_APP" >&2
            exit 1
          fi

      - name: Inject frida-gadget (diagnostic)
        if: github.event.inputs.gadget == 'true'
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/BiliBiliMD.app"
          test -d "$APP_PATH"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test -n "$APP_EXECUTABLE"
          test -s "$APP_PATH/$APP_EXECUTABLE"

          # 17.x publishes the iOS gadget only as ios-universal (fat: contains
          # the arm64 device slice); there is no ios-arm64 asset.
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/frida-gadget.dylib.xz" \
            "https://github.com/frida/frida/releases/download/17.24.3/frida-gadget-17.24.3-ios-universal.dylib.xz"
          xz -d "$RUNNER_TEMP/frida-gadget.dylib.xz"
          # 注入库一律放 .app/Frameworks/：这个包里已经三个注入库
          # （libellekit / BilibiliVideoTools / libBiliBiliMDDylib）都在 Frameworks/ 下、
          # 以 @executable_path/Frameworks/... 被加载，真机能起；而放 .app 根目录的
          # FridaGadget.dylib 不在这条路径上，本地重签环节（按 .app/Frameworks/*.dylib
          # 逐个签嵌套库）也不会覆盖它 —— 未签名的嵌套库在加载瞬间就被内核杀掉，
          # 现象就是「一打开就闪退、设备日志一条都没有」（插件 %ctor 根本没跑到）。
          # 另外 gadget 自身的 LC_ID 就是 @executable_path/Frameworks/FridaGadget.dylib
          # （已用本机解析下载到的 17.24.3 ios-universal 确认），路径对齐它。
          mkdir -p "$APP_PATH/Frameworks"
          install -m 0755 "$RUNNER_TEMP/frida-gadget.dylib" "$APP_PATH/Frameworks/FridaGadget.dylib"
          lipo -archs "$APP_PATH/Frameworks/FridaGadget.dylib" | grep -qw arm64

          cat > "$APP_PATH/Frameworks/FridaGadget.config" <<'GADGETCFG'
          {"interaction": {"type": "script", "path": "NJPipProbe.js"}}
          GADGETCFG
          test -s Tools/frida/NJPipProbe.js
          install -m 0644 Tools/frida/NJPipProbe.js "$APP_PATH/Frameworks/NJPipProbe.js"

          git clone --depth 1 https://github.com/tyilo/insert_dylib "$RUNNER_TEMP/insert_dylib"
          # upstream keeps the single-file source at insert_dylib/main.c (C, not C++).
          # current master has no --all-load-commands flag; its default appends the
          # load command after the last one, which is the behavior we want.
          # --all-yes/--strip-codesig keep it fully non-interactive.
          test -s "$RUNNER_TEMP/insert_dylib/insert_dylib/main.c"
          clang -O2 -o "$RUNNER_TEMP/insert_dylib_bin" \
            "$RUNNER_TEMP/insert_dylib/insert_dylib/main.c"
          "$RUNNER_TEMP/insert_dylib_bin" --all-yes --strip-codesig \
            "@executable_path/Frameworks/FridaGadget.dylib" \
            "$APP_PATH/$APP_EXECUTABLE" "$APP_PATH/$APP_EXECUTABLE.patched"
          mv "$APP_PATH/$APP_EXECUTABLE.patched" "$APP_PATH/$APP_EXECUTABLE"
          chmod 0755 "$APP_PATH/$APP_EXECUTABLE"

          # Both injected libraries must be present as load commands.
          otool -l "$APP_PATH/$APP_EXECUTABLE" | grep -A2 'cmd LC_LOAD_DYLIB' \
            | grep -F 'name @executable_path/Frameworks/FridaGadget.dylib'
          otool -l "$APP_PATH/$APP_EXECUTABLE" | grep -A2 'cmd LC_LOAD_DYLIB' \
            | grep -F 'libBiliBiliMDDylib.dylib'

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/BiliBiliMD.app"
          test -d "$APP_PATH"
          test -n "$IPA_ARTIFACT_NAME"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/BiliBiliMD.app"
          pushd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/${IPA_ARTIFACT_NAME}.ipa" Payload
          popd
          IPA_SIZE_BYTES="$(stat -f '%z' "$RUNNER_TEMP/${IPA_ARTIFACT_NAME}.ipa")"
          echo "Unsigned IPA size: $IPA_SIZE_BYTES bytes"
          test "$IPA_SIZE_BYTES" -lt $((350 * 1024 * 1024))
          mkdir -p artifacts
          cp "$RUNNER_TEMP/${IPA_ARTIFACT_NAME}.ipa" "artifacts/${IPA_ARTIFACT_NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_ARTIFACT_NAME }}
          path: artifacts/${{ env.IPA_ARTIFACT_NAME }}.ipa
          if-no-files-found: error
          retention-days: 7
